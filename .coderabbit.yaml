# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: true
  allow_author_approval: false
  high_level_summary: false
  poem: false
  review_status: true
  review_details: true
  pre_merge_checks:
    docstrings:
      # Sandy documents contracts and non-obvious behavior; it has no coverage quota.
      mode: "off"
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^main$"
      - "^staging$"
