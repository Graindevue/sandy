name: CI

# Runs the merge gate on integration and release branches.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# A newer commit on the same ref supersedes any in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json's `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Actions authentication and authorization helpers
        run: node --test .github/actions/review/*.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # Benchmark CLI integration tests import the shipped worker adapters.
      - name: Build shipped packages
        run: pnpm --filter @sandy/shared-types --filter @sandy/manifest-builder --filter @sandy/bot-worker build

      - name: Test
        run: pnpm test

  dependency-cache:
    name: Reviewed dependency cache provider
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the shipped worker adapter
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @sandy/shared-types --filter @sandy/manifest-builder --filter @sandy/bot-worker build

      # Runtime cache credentials only; no Codex login or model provider.
      - name: Expose the optional cache runtime to trusted review steps
        id: cache-runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (token) core.setSecret(token);
            for (const name of [
              'ACTIONS_RUNTIME_TOKEN',
              'ACTIONS_CACHE_URL',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_RUNTIME_URL',
              'ACTIONS_CACHE_SERVICE_V2',
            ]) {
              const value = process.env[name];
              if (value) core.exportVariable(name, value);
            }

      - name: Save and restore harmless downloads through the actual provider
        run: node scripts/dependency-cache-probe.mjs

  codex-compatibility:
    name: Pinned Codex sandbox compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the exact deployed Codex pin
        run: npm install --global --ignore-scripts @openai/codex@0.162.0

      - name: Install pnpm for the trusted preparation adapter build
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Build the shipped preparation adapter
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @sandy/shared-types --filter @sandy/manifest-builder --filter @sandy/bot-worker build

      - name: Prepare the dedicated bubblewrap AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      # Uses a local mock provider, temporary canaries and a clean child env.
      # No sandy-codex environment, auth secret, App key or model request.
      - name: Verify concurrent turns and Linux sandbox boundaries without credentials
        run: node scripts/codex-compatibility-probe.mjs codex "$RUNNER_TEMP/codex-compatibility.json"

      - name: Verify native concurrent turns through the shipped managed adapter
        run: node scripts/codex-managed-runtime-probe.mjs codex

      - name: Reproduce controlled benchmark preparation without credentials or models
        run: node scripts/review-preparation-probe.mjs codex "$RUNNER_TEMP/review-preparation.json"

      - name: Upload the bounded preparation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-preparation
          path: ${{ runner.temp }}/review-preparation.json
          if-no-files-found: warn

      - name: Upload the bounded compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-compatibility
          path: ${{ runner.temp }}/codex-compatibility.json
          if-no-files-found: warn
