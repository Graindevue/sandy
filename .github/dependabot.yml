version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
