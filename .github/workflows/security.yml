name: Security

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install checksum-verified Gitleaks
        run: node scripts/install-gitleaks.mjs
      - name: Verify scanner detection and redaction
        run: node --test scripts/check-secrets.test.mjs
      - name: Scan full Git history with redacted output
        run: bash scripts/check-secrets.sh

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit all locked dependencies
        run: pnpm audit

  native-sandbox:
    name: Native Linux sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install trusted dependencies and pinned native Codex
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --global --ignore-scripts @openai/codex@0.162.0
          test "$(codex --version)" = 'codex-cli 0.162.0'
      - name: Prepare Linux sandbox prerequisites
        run: |
          # Use the same scoped AppArmor allowance as the review action; keep
          # the runner's global user-namespace restrictions in place.
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Run hostile lifecycle fixture in the native sandbox
        env:
          SANDY_NATIVE_SANDBOX_TEST: '1'
        run: |
          # This fixture invokes `codex sandbox`, never an LLM or a login. It
          # uses dummy credentials and does not access a consumer repository.
          pnpm exec vitest run packages/bot-worker/src/worker/codex-exec-runner.test.ts \
            -t 'runs one native Linux npm install and test with credentials inaccessible' \
            --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/sandy-native-sandbox-results.json"
      - name: Require an executed native probe, never a skipped test
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'sandy-native-sandbox-results.json'), 'utf8'));
          const probes = report.testResults.flatMap((suite) => suite.assertionResults).filter((test) =>
            test.title === 'runs one native Linux npm install and test with credentials inaccessible');
          assert.deepEqual(probes.map((test) => test.status), ['passed'], 'The native sandbox probe must execute and pass');
          NODE
