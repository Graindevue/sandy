# Install in a PRIVATE caller repository. SANDY_BENCHMARK_REF is a reviewed full
# Sandy commit SHA, independent from the production SANDY_REF.
name: Sandy isolated benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Matched repetitions (start with 1; promotion needs at least 3).
        type: choice
        options: ['1', '2', '3']
        default: '1'
      cases:
        description: Pinned evaluation changes.
        type: choice
        options: ['defects,clean', defects, clean]
        default: 'defects,clean'

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      github.event.repository.private == true &&
      github.event.repository.fork == false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.run_attempt == 1
    concurrency:
      group: sandy-codex-test-session
      queue: max
      cancel-in-progress: false
    environment: sandy-codex-test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Authorize a private manual benchmark
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (context.eventName !== 'workflow_dispatch' ||
                process.env.GITHUB_RUN_ATTEMPT !== '1' || !repo.private || repo.fork ||
                context.ref !== `refs/heads/${repo.default_branch}`) {
              throw new Error('Only new manual runs on a private default branch are accepted');
            }
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!['write', 'maintain', 'admin'].includes(access.permission)) {
              throw new Error('A collaborator with write permission must request the benchmark');
            }

      - name: Validate the independently reviewed source pin
        shell: bash
        env:
          SANDY_BENCHMARK_REF: ${{ vars.SANDY_BENCHMARK_REF }}
        run: |
          [[ "$SANDY_BENCHMARK_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Set SANDY_BENCHMARK_REF to the full SHA of a reviewed Sandy commit.' >&2
            exit 1
          }

      - name: Checkout pinned Sandy source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Graindevue/sandy
          ref: ${{ vars.SANDY_BENCHMARK_REF }}
          path: sandy
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sandy/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: sandy/pnpm-lock.yaml

      - name: Build the trusted benchmark runner
        shell: bash
        working-directory: sandy
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @sandy/shared-types --filter @sandy/manifest-builder --filter @sandy/bot-worker build
          npm install --global --ignore-scripts @openai/codex@0.162.0

      - name: Prepare sandbox prerequisites and credential paths
        id: prepare
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          printf 'CODEX_HOME=%s\nGITHUB_APP_PRIVATE_KEY_PATH=%s\nSANDY_AUTH_ENVIRONMENT=sandy-codex-test\n' \
            "$RUNNER_TEMP/sandy-benchmark-auth" "$RUNNER_TEMP/sandy-benchmark-app.pem" >> "$GITHUB_ENV"

      - name: Obtain dedicated environment writeback permission before login use
        id: auth-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.SANDY_APP_CLIENT_ID || secrets.SANDY_APP_ID }}
          private-key: ${{ secrets.SANDY_APP_PRIVATE_KEY }}
          permission-environments: write

      # Job-level environment secrets are read after the test stream's lock.
      - name: Restore the current dedicated test login
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ steps.auth-token.outputs.token }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          SANDY_APP_PRIVATE_KEY: ${{ secrets.SANDY_APP_PRIVATE_KEY }}
        run: node sandy/.github/actions/review/auth.mjs seed

      - name: Run fixed serial and parallel evaluations
        id: benchmark
        shell: bash
        working-directory: sandy
        env:
          SANDY_BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          SANDY_BENCHMARK_CASES: ${{ inputs.cases }}
        run: |
          mkdir -p "$RUNNER_TEMP/sandy-benchmark-results"
          sandy_log_guard="$(node -p 'require("node:crypto").randomUUID()')"
          printf '::stop-commands::%s\n' "$sandy_log_guard"
          trap 'printf "::%s::\n" "$sandy_log_guard"' EXIT
          timeout --signal=TERM --kill-after=60s 65m node scripts/review-benchmark.mjs run \
            --ci-home "$CODEX_HOME" --require-auth-refresh \
            --out "$RUNNER_TEMP/sandy-benchmark-results/results.json" \
            --repetitions "$SANDY_BENCHMARK_REPETITIONS" --cases "$SANDY_BENCHMARK_CASES" \
            --timeout-minutes 60 --agent-timeout-seconds 300

      # A fresh App token avoids a one-hour token expiring during measurements.
      - name: Create a fresh persistence token
        if: ${{ always() && steps.auth.outcome == 'success' }}
        id: persist-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.SANDY_APP_CLIENT_ID || secrets.SANDY_APP_ID }}
          private-key: ${{ secrets.SANDY_APP_PRIVATE_KEY }}
          permission-environments: write

      - name: Persist the dedicated test session
        if: ${{ always() && steps.auth.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.persist-token.outputs.token }}
        run: node sandy/.github/actions/review/auth.mjs persist

      - name: Remove local credentials
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: node sandy/.github/actions/review/auth.mjs cleanup

      - name: Upload bounded findings and measurements for human adjudication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandy-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/sandy-benchmark-results/
          if-no-files-found: warn
          retention-days: 14
