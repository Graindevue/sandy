name: CI

# Runs the merge gate (lint, type-check, test) on every PR — regardless of base
# branch — and on direct pushes to the integration branches. The .sandcastle AFK
# harness merges agent branches straight into `staging` without a per-issue PR,
# so the push trigger is what guards those merges.
on:
  pull_request:
  push:
    branches: [main, staging]

# A newer commit on the same ref supersedes any in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from package.json's `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall rebuilds the native tree-sitter bindings via node-gyp.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test
