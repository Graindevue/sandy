name: Dependabot auto-merge

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
  workflow_dispatch:
  status:

# GitHub branch rules retain responsibility for checks, fresh approvals and
# resolved review threads. This workflow never approves or bypasses them.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name != 'pull_request_review' ||
       (github.event.review.user.login == 'coderabbitai[bot]' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'status' ||
       (github.event.context == 'CodeRabbit' && github.event.state == 'success'))
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code runs with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { mergeDependabotUpdates } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge.mjs`
            );
            core.setOutput('merged', await mergeDependabotUpdates({ github, context, core }));
      # A rerun recovers dispatches independently of PRs, including already merged ones.
      # Only merge runs and explicit retries dispatch checks, preventing workflow_run loops.
      - name: Dispatch post-merge checks
        if: ${{ always() && (steps.merge.outputs.merged == 'true' || github.run_attempt > 1) }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { dispatchPostMergeChecks } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge.mjs`
            );
            await dispatchPostMergeChecks({ github, context, core });
